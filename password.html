<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peichi Lin — Portfolio</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
            background: #0a0a0a;
      color: #f0f0f0;
            font-family: 'Helvetica Neue', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
}
    .container {
            text-align: center;
      max-width: 360px;
      width: 90%;
}
    h1 {
            font-size: 1.1rem;
      font-weight: 400;
      letter-spacing: 0.08em;
      margin-bottom: 2.5rem;
      opacity: 0.5;
      text-transform: uppercase;
}
    input[type="password"] {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255,255,255,0.2);
      color: #f0f0f0;
            font-size: 1.5rem;
      padding: 0.5rem 0;
      text-align: center;
      letter-spacing: 0.3em;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="password"]:focus {
            border-bottom-color: rgba(255,255,255,0.7);
}
    .error {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: #ff6b6b;
            opacity: 0;
      transition: opacity 0.2s;
    }
    .error.visible { opacity: 1; }
  </style>
    </head>
    <body>
      <div class="container">
        <h1>Peichi Lin</h1>
        <input type="password" id="pw" placeholder="· · · ·" autofocus autocomplete="off" />
        <p class="error" id="err">Incorrect password</p>
      </div>
      <script>
        document.getElementById('pw').addEventListener('keydown', async (e) => {
          if (e.key !== 'Enter') return;
      const password = e.target.value;
      const res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
});
      if (res.ok) {
        window.location.href = '/';
} else {
        document.getElementById('err').classList.add('visible');
        e.target.value = '';
        setTimeout(() => document.getElementById('err').classList.remove('visible'), 2000);
}
});
  </script>
</body>
</html>
